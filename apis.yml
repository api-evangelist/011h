name: 011h
description: 011h (011h Sustainable Construction S.L.) is a Barcelona-based construction technology company founded
  in 2020 that designs and builds low-carbon residential, affordable-housing, flex-living and hospitality buildings
  using an industrialized building system and a digital platform connecting factory, design and site. The company
  combines standardized hybrid concrete/wood/steel prefabricated components, an integrated network of qualified
  manufacturers, and an in-house software platform covering design, contracting and construction execution with
  end-to-end traceability. It is a certified B Corporation and raised EUR 20M in October 2025 co-led by Ship2B Ventures
  and CDTI. As of this profile 011h publishes no public developer program, API documentation or machine-readable
  API contract; its software is an internal/customer-facing product rather than a platform API.
